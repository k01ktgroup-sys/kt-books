<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KTライブラリ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Outfit:wght@500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
/* Layout: sticky header (brand stripe + app name + selected employee) → tab row → one content column (max 960px).
   Palette follows the KT Group site: cream ground, dark-brown ink, green / orange-red / yellow / orange / sky accents, pill buttons, round cards. */
:root{
  --bg:#fffbe8; --surface:#ffffff; --surface-2:#fbf3d9; --line:#eadfc0;
  --fg:#231815; --muted:#6e625c;
  --green:#007237; --red:#e2470e; --yellow:#f9be00; --orange:#ed7700; --sky:#64b6d6;
  --accent:#e2470e; --accent-fg:#ffffff; --accent-soft:#fde8dd;
  --brand:#007237; --brand-soft:#e3f1e8;
  --ok:#007237; --ok-soft:#e3f1e8; --busy:#9a5200; --busy-soft:#fff1c7;
  --bad:#b4231b; --bad-soft:#fde3e0; --off:#6e625c; --off-soft:#efe9e2;
  --label-bg:#ffffff; --label-line:#231815;
  --shadow:0 2px 0 rgba(35,24,21,.06),0 6px 18px rgba(35,24,21,.06);
  --font:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
  --mono:"Outfit","Noto Sans JP",sans-serif;
  --r:16px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:17px;line-height:1.65}
h1,h2,h3{text-wrap:balance;line-height:1.35;margin:0}
h2{font-size:1.3rem} h3{font-size:1.08rem} p{margin:0}
.panel>h2:first-child,.panel>div:first-child>h2{display:flex;align-items:center;gap:10px}
.panel>h2:first-child::before,.panel>div:first-child>h2::before{content:"";flex:none;width:8px;height:1.1em;border-radius:99px;background:var(--orange)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.9rem}
[hidden]{display:none!important}

.sample-strip{background:var(--busy-soft);color:var(--busy);font-size:.85rem;padding:6px 16px;text-align:center;font-weight:700}
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.stripe{display:grid;grid-template-columns:3fr 1fr 4fr 2fr 1.5fr;height:6px}
.stripe i:nth-child(1){background:var(--yellow)}.stripe i:nth-child(2){background:var(--green)}.stripe i:nth-child(3){background:var(--red)}.stripe i:nth-child(4){background:var(--orange)}.stripe i:nth-child(5){background:var(--sky)}
.top-inner{max-width:960px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.brand{display:flex;flex-direction:column}
.brand b{font-size:1.08rem;letter-spacing:.04em} .brand span{font-size:.8rem;color:var(--brand);font-weight:700}
.who{display:flex;align-items:center;gap:10px;background:var(--brand-soft);border-radius:999px;padding:5px 5px 5px 14px;min-width:0}
.who .lbl{font-size:.74rem;color:var(--muted);display:block;line-height:1.2}
.who .nm{font-weight:700;font-size:1.02rem;line-height:1.3}
.who.none{background:var(--bad-soft)}
nav.tabs{max-width:960px;margin:0 auto;padding:0 16px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
nav.tabs button{border:0;background:none;padding:10px 0 12px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;font-size:1rem;min-height:48px;white-space:nowrap}
@media (max-width:480px){nav.tabs button{font-size:.88rem}}
nav.tabs button[aria-current="page"]{color:var(--brand);border-bottom-color:var(--brand)}
.badge{display:inline-block;min-width:1.4em;padding:0 .35em;border-radius:999px;background:var(--bad);color:#fff;font-size:.72rem;margin-left:3px;line-height:1.5}
.badge.n{background:var(--brand);color:#fff}
main{max-width:960px;margin:0 auto;padding:20px 16px 64px;display:flex;flex-direction:column;gap:16px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:10px 22px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;font-size:1rem;text-decoration:none;color:var(--fg)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);box-shadow:0 3px 0 #b8380a}
.btn.primary:active{transform:translateY(2px);box-shadow:none}
.btn.green{background:var(--green);color:#fff;border-color:var(--green);box-shadow:0 3px 0 #00542a}
.btn.danger{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{min-height:40px;padding:6px 14px;font-size:.92rem}
.btn.big{min-height:56px;font-size:1.1rem;width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;flex-wrap:wrap;gap:10px}
.btn-row.nowrap{flex-wrap:nowrap}
.qr-btn{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:12px 18px;border-radius:var(--r);border:2px solid var(--green);background:var(--brand-soft);cursor:pointer;text-align:left;color:var(--fg)}
.qr-btn svg{flex:none;width:34px;height:34px;color:var(--green)}
.qr-btn b{display:block;font-size:1.08rem}
.qr-btn span{font-size:.86rem;color:var(--muted)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.notice{border-radius:var(--r);padding:12px 16px;display:flex;flex-direction:column;gap:4px}
.notice.info{background:var(--accent-soft)} .notice.warn{background:var(--busy-soft)} .notice.bad{background:var(--bad-soft)} .notice.plain{background:var(--surface-2)}
.pill{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;font-weight:700;font-size:.86rem;white-space:nowrap}
.st-ok{background:var(--ok-soft);color:var(--ok)} .st-busy{background:var(--busy-soft);color:var(--busy)}
.st-bad{background:var(--bad-soft);color:var(--bad)} .st-off{background:var(--off-soft);color:var(--off)}
.chip-sample{display:inline-block;font-size:.7rem;font-weight:700;color:var(--busy);border:1px solid currentColor;border-radius:4px;padding:0 5px;line-height:1.5;vertical-align:middle;margin-left:4px}
.spine{font-family:var(--mono);font-weight:700;background:var(--label-bg);border:1px solid var(--label-line);border-radius:4px;padding:2px 8px;font-size:.88rem;letter-spacing:.03em;white-space:nowrap}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.field .lab{font-size:.9rem;font-weight:700}
.field .hint{font-size:.82rem;color:var(--muted)}
input[type=text],input[type=password],input[type=date],input[type=search],input[type=number],select{width:100%;min-height:48px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 12px;font-size:1rem}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:44px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--green);color:#fff;border-color:var(--green)}

.list{display:flex;flex-direction:column;gap:10px}
.title-card{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.title-card:hover{border-color:var(--green)}
.tc-main{display:flex;flex-direction:column;gap:2px;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--fg)}
.tc-main .t{font-weight:700;font-size:1.08rem}
.tc-main .m{font-size:.88rem;color:var(--muted)}
.tc-counts{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
tr.hl td{background:var(--brand-soft)}
.who-line{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;background:var(--brand-soft);border-radius:var(--r);padding:10px 14px}
.intro h3{margin-top:6px;color:var(--green)}
textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 12px;font-size:1rem}
.count{font-size:.95rem;color:var(--muted)}
.copy{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.copy.hl{border:2px solid var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.copy-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
dl.kv{display:grid;grid-template-columns:max-content 1fr;gap:8px 18px;margin:0}
dl.kv dt{color:var(--muted);font-weight:700} dl.kv dd{margin:0;min-width:0}
@media (max-width:480px){dl.kv{grid-template-columns:1fr;gap:0}dl.kv dd{margin-bottom:8px}}
.back{align-self:flex-start}

.loan{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.loan.over{border:2px solid var(--bad)}
.due{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.due .d{font-size:1.35rem;font-weight:700}
.left{font-weight:700} .left.ok{color:var(--ok)} .left.bad{color:var(--bad)} .left.busy{color:var(--busy)}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
td.wrap{white-space:normal;min-width:170px}
th{background:var(--surface-2);font-size:.84rem}
tr:last-child td{border-bottom:0}
tr.grp td{background:var(--surface-2);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:640px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.tile .n{font-family:var(--mono);font-size:1.7rem;font-weight:600;line-height:1.2}
.tile .l{font-size:.86rem;color:var(--muted);font-weight:700}
.tile.alert{border-color:var(--bad);background:var(--bad-soft)} .tile.alert .n{color:var(--bad)}
.subtabs{display:flex;flex-wrap:wrap;gap:6px}
.subtabs button{min-height:44px;padding:6px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer}
.subtabs button[aria-pressed="true"]{background:var(--green);color:#fff;border-color:var(--green)}
.admin-flag{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--green);color:#fff;border-radius:var(--r);padding:10px 16px;font-size:.92rem}
.admin-flag .btn{min-height:36px;padding:4px 12px;font-size:.85rem}
.progress{height:12px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--green)}

ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
ol.steps li::before{content:counter(s);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--green);color:#fff;font-weight:700;font-family:var(--mono)}
ul.rules{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}

.overlay{position:fixed;inset:0;background:rgba(10,20,18,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:12px}
@media (min-width:640px){.overlay{align-items:center}}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:560px;max-height:calc(100% - 8px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.confirm-box{border:2px solid var(--accent);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:max-content 1fr;gap:8px 14px;margin:0}
.confirm-box dt{color:var(--muted);font-weight:700} .confirm-box dd{margin:0;font-weight:700;min-width:0}
.check{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);padding:12px;border-radius:8px;cursor:pointer}
.check input{width:24px;height:24px;flex:none;margin-top:2px}
.emp-pick{display:grid;gap:10px}
.dept-pick{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.emp-pick button{min-height:62px;text-align:left;padding:10px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;display:flex;flex-direction:column}
.emp-pick button[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-soft)}
.emp-pick .n{font-weight:700;font-size:1.08rem} .emp-pick .d{font-size:.86rem;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.form-grid{grid-template-columns:1fr}}
.form-grid .full{grid-column:1/-1}
.err{color:var(--bad);font-weight:700;font-size:.92rem}

/* scanner */
.scan-live{position:relative;border-radius:var(--r);overflow:hidden;background:#000;aspect-ratio:4/3;max-width:100%}
.scan-live video{width:100%;height:100%;object-fit:cover;display:block}
.scan-live .frame{position:absolute;inset:18% 22%;border:3px solid #fff;border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.scan-result{border-radius:var(--r);padding:10px 14px;font-weight:700}
.scan-result.ok{background:var(--ok-soft);color:var(--ok)} .scan-result.ng{background:var(--bad-soft);color:var(--bad)} .scan-result.warn{background:var(--busy-soft);color:var(--busy)}
.photo-btn{position:relative;overflow:hidden}
.scan-book{border:2px solid var(--green)}
.done-panel{align-items:center;text-align:center;border:2px solid var(--green)}
.done-mark{width:64px;height:64px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:2rem;font-weight:700}
.photo-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* labels */
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(58mm,1fr));gap:4mm}
.label{border:1px dashed var(--line);border-radius:6px;padding:3mm;display:grid;grid-template-columns:24mm 1fr;gap:3mm;align-items:center;background:#fff;color:#111;break-inside:avoid}
.label .q svg,.label .q img{width:24mm;height:24mm;display:block}
.label .id{font-family:var(--mono);font-weight:600;font-size:13pt;letter-spacing:.02em}
.label .tt{font-size:8pt;line-height:1.35;max-height:3.9em;overflow:hidden}
.label .org{font-size:7pt;color:#555}
#printArea{display:none}
@media print{
  body>*:not(#printArea){display:none!important}
  #printArea{display:block}
  body{background:#fff}
  .label{border:1px solid #bbb}
  @page{size:A4;margin:10mm}
}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:60;background:var(--green);color:#fff;padding:12px 22px;border-radius:999px;font-weight:700;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast.ng{background:var(--bad)}
.empty{padding:26px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.spin{display:inline-block;width:18px;height:18px;border:3px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<div class="sample-strip" id="sampleStrip" hidden>サンプルデータが登録されています（架空の書籍・従業員・貸出）。本番前に総務部の「設定」から削除してください。</div>
<header class="top">
  <div class="stripe" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  <div class="top-inner">
    <div class="brand"><b>KTライブラリ</b><span>本社ビル8階 ／ 総務部</span></div>
    <div class="who none" id="who">
      <div><span class="lbl">利用者</span><span class="nm" id="whoName">名前が選ばれていません</span></div>
      <button class="btn sm primary" id="whoBtn" type="button">名前を選ぶ</button>
    </div>
  </div>
  <nav class="tabs" id="tabs" aria-label="画面の切り替え"></nav>
</header>
<main id="main"><div class="empty"><span class="spin"></span>　データを読み込んでいます…</div></main>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<div id="printArea"></div>

<script>
(function(){
"use strict";
var MAX_LOANS=2, MAX_EXT=0, LOAN_DAYS=14, EXT_DAYS=14;  /* KTライブラリ：連続14日間まで（延長なし） */
var LS_EMP="shoko.emp", LS_TOKEN="shoko.adminToken";
/* Inside Apps Script the page talks to the server through google.script.run.
   Hosted elsewhere (the admin page on GitHub Pages, where the camera works) it POSTs to the published web app instead. */
var API_URL="https://script.google.com/macros/s/AKfycbyF9c08dNZ2K-3_jaeZaswShQkHdb68qyf__k_dvPfkKSGNHo-sS-w7siH9xbXkl1EWUQ/exec";
var IN_GAS=!!(window.google && google.script && google.script.run);
/* The camera-capable pages on GitHub Pages: employees use the top page, 総務部 uses admin.html. QR labels point to the top page. */
var PAGE_URL="https://k01ktgroup-sys.github.io/kt-books/";
var ADMIN_URL=PAGE_URL+"admin.html";
var QR_ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/></svg>';

var S={ loaded:false, loadErr:null, today:"", url:"", books:{}, emps:{}, loans:{},
  view:"books", group:null, copyId:null, empId:null, token:null,
  q:"", status:"all", cat:"", adminTab:"scan", histQ:"", histStatus:"all", scanCopy:null,
  inv:null, labelSel:{}, scanNote:null };
try{ S.empId=localStorage.getItem(LS_EMP); S.token=localStorage.getItem(LS_TOKEN); var mt=JSON.parse(localStorage.getItem("shoko.mailTo")||"null"); if(mt){ S.lastOffice=mt[0]; S.lastAddr=mt[1]; S.lastTel=mt[2]; } }catch(e){}

/* ---------- server bridge ---------- */
function call(action, payload){
  return new Promise(function(res, rej){
    function done(txt){
      var r; try{ r=JSON.parse(txt); }catch(e){ rej({code:"parse"}); return; }
      if(r.ok) res(r.data);
      else rej({ code:r.error.code, userMessage: r.error.user ? r.error.message : null, message:r.error.message });
    }
    function fail(err){ rej({ code:"network", message:String(err&&err.message||err) }); }
    if(IN_GAS){
      google.script.run.withSuccessHandler(done).withFailureHandler(fail).api(action, payload||{});
    } else {
      fetch(API_URL, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({action:action, payload:payload||{}}) })
        .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.text(); })
        .then(done, fail);
    }
  });
}
function applyState(st){
  if(!st) return;
  S.today=st.today; S.url=st.url;
  S.books={}; st.books.forEach(function(b){ S.books[b.id]=b; });
  S.emps={}; st.emps.forEach(function(e){ S.emps[e.id]=e; });
  S.loans={}; st.loans.forEach(function(l){ S.loans[l.loanNo]=l; });
  S.intros={}; (st.intros||[]).forEach(function(x){ S.intros[x.group]=x; });
  S.mailReqs=st.mailReqs||[]; S.mailExtraDays=st.mailExtraDays||7;
  S.loaded=true; S.loadErr=null;
}
function refresh(){
  return call("state").then(function(st){ applyState(st); if(!modalOpen) render(); else renderHeader(); })
    .catch(function(e){ if(!S.loaded){ S.loadErr=e; render(); } });
}

/* ---------- helpers ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function $(id){ return document.getElementById(id); }
function addDays(ymd,n){ var p=ymd.split("-").map(Number); return new Date(Date.UTC(p[0],p[1]-1,p[2]+n)).toISOString().slice(0,10); }
function diffDays(a,b){ var pa=a.split("-").map(Number), pb=b.split("-").map(Number); return Math.round((Date.UTC(pb[0],pb[1]-1,pb[2])-Date.UTC(pa[0],pa[1]-1,pa[2]))/86400000); }
var WD=["日","月","火","水","木","金","土"];
function jp(y){ if(!y) return "—"; var p=y.split("-").map(Number); return p[0]+"年"+p[1]+"月"+p[2]+"日（"+WD[new Date(Date.UTC(p[0],p[1]-1,p[2])).getUTCDay()]+"）"; }
function js(y){ return y ? y.replace(/-/g,"/") : "—"; }
function chip(o){ return o&&o.sample ? '<span class="chip-sample">サンプル</span>' : ""; }
function groupOf(id){ return String(id).replace(/-\d+$/,""); }
function copyNo(id){ var m=/-(\d+)$/.exec(id); return m?m[1]:"1"; }
function loanArr(){ return Object.keys(S.loans).map(function(k){ return S.loans[k]; }); }
function bookArr(){ return Object.keys(S.books).map(function(k){ return S.books[k]; }).sort(function(a,b){ return cmpId(a.id,b.id); }); }
function cmpId(a,b){ var ga=groupOf(a), gb=groupOf(b); if(ga!==gb) return ga<gb?-1:1; return Number(copyNo(a))-Number(copyNo(b)); }
function empArr(){ return Object.keys(S.emps).map(function(k){ return S.emps[k]; }).sort(function(a,b){ return a.id<b.id?-1:1; }); }
function activeOfBook(id){ return loanArr().filter(function(l){ return l.status==="active" && l.bookId===id; })[0]||null; }
function activeOfEmp(id){ return loanArr().filter(function(l){ return l.status==="active" && l.empId===id; }).sort(function(a,b){ return a.dueDate<b.dueDate?-1:1; }); }
function isOver(l){ return l.status==="active" && S.today>l.dueDate; }
function activeEmps(){ return empArr().filter(function(x){ return x.active; }); }
function deptList(){ var seen={}, out=[]; activeEmps().forEach(function(x){ var d=x.dept||"（所属なし）"; if(!seen[d]){ seen[d]=1; out.push(d); } }); return out.sort(function(a,b){ return a.localeCompare(b,"ja"); }); }
function empsInDept(d){ return activeEmps().filter(function(x){ return (x.dept||"（所属なし）")===d; }).sort(function(a,b){ return a.id<b.id?-1:a.id>b.id?1:0; }); }

function empName(id){ var e=S.emps[id]; return e?e.name:id; }
function bookTitle(id){ var b=S.books[id]; return b?b.title:id; }
function copyStatus(b){
  if(b.suspended) return /^閲覧のみ/.test(b.suspendReason||"") ? {key:"off",label:"閲覧のみ",cls:"st-off",viewOnly:true} : {key:"off",label:"利用停止",cls:"st-off"};
  var l=activeOfBook(b.id);
  if(l) return isOver(l)?{key:"busy",label:"貸出中（期限超過）",cls:"st-bad",loan:l}:{key:"busy",label:"貸出中",cls:"st-busy",loan:l};
  return {key:"ok",label:"貸出可能",cls:"st-ok"};
}
function groups(){
  var m={}; bookArr().forEach(function(b){ var g=groupOf(b.id); (m[g]=m[g]||{id:g,copies:[]}).copies.push(b); });
  return Object.keys(m).sort().map(function(k){ var g=m[k], f=g.copies[0];
    g.title=f.title; g.author=f.author; g.category=f.category; g.sample=f.sample;
    g.avail=g.copies.filter(function(c){ return copyStatus(c).key==="ok"; }).length;
    g.lent=g.copies.filter(function(c){ return copyStatus(c).key==="busy"; }).length;
    g.key = g.avail ? "ok" : g.lent ? "busy" : "off"; return g; });
}
function parseCode(text){
  text=String(text||"").trim();
  var m=/[?&]b=([A-Za-z0-9-]+)/.exec(text); if(m) return m[1].toUpperCase();
  if(/^[A-Za-z]{1,4}-\d{1,4}(-\d{1,3})?$/.test(text)) return text.toUpperCase();
  return null;
}

/* ---------- toast / modal ---------- */
function toast(msg, ng){ var r=$("toastRoot"); r.innerHTML='<div class="toast'+(ng?" ng":"")+'" role="status">'+esc(msg)+'</div>'; clearTimeout(toast.t); toast.t=setTimeout(function(){ r.innerHTML=""; },3800); }
var modalOpen=false, modalCleanup=null, modalLocked=false;
function openModal(html, mount){
  if(modalCleanup){ modalCleanup(); modalCleanup=null; }
  modalOpen=true;
  $("modalRoot").innerHTML='<div class="overlay" id="ov"><div class="modal" role="dialog" aria-modal="true">'+html+'</div></div>';
  $("ov").addEventListener("click",function(e){ if(e.target.id==="ov" && !modalLocked) closeModal(); });
  if(mount) mount();
  var f=$("modalRoot").querySelector("[autofocus]"); if(f) f.focus();
}
function closeModal(){ if(modalCleanup){ modalCleanup(); modalCleanup=null; } modalOpen=false; modalLocked=false; $("modalRoot").innerHTML=""; render(); }
document.addEventListener("keydown",function(e){ if(e.key==="Escape" && modalOpen && !modalLocked) closeModal(); });

/* Run a server write. Success → close + toast. Failure → keep dialog, explain, allow retry (never shows success). */
function runSave(btn, action, payload, okMsg, after){
  modalLocked=true;
  var orig=btn.innerHTML; btn.disabled=true; btn.innerHTML='<span class="spin"></span> 保存しています…';
  return call(action, payload).then(function(data){
    modalLocked=false;
    if(data && data.state) applyState(data.state);
    if(after) after(data);
    closeModal(); toast(typeof okMsg==="function"?okMsg(data):okMsg);
  }).catch(function(err){
    modalLocked=false; btn.disabled=false; btn.innerHTML=orig;
    if(err.code==="auth"){ S.token=null; try{ localStorage.removeItem(LS_TOKEN); }catch(e){} }
    var box=$("saveErr"); if(!box) { toast(err.userMessage||"保存できませんでした。もう一度お試しください。",true); return; }
    box.hidden=false;
    box.innerHTML = err.userMessage
      ? '<div class="notice bad" role="alert"><b>この操作はできませんでした。</b><span>'+esc(err.userMessage)+'</span></div>'
      : '<div class="notice bad" role="alert"><b>保存できませんでした。登録は完了していません。</b><span>通信状態を確認して、もう一度「確定する」を押してください。続けて失敗する場合は総務部へ連絡してください。（'+esc(err.code)+'）</span></div>';
    if(err.userMessage && err.code!=="auth") btn.disabled=true;
    refresh();
  });
}

/* ---------- main render ---------- */
function render(){
  renderHeader();
  var main=$("main"), ae=document.activeElement, fid=ae&&ae.id&&main.contains(ae)?ae.id:null, sel=null;
  if(fid && ae.selectionStart!=null){ try{ sel=[ae.selectionStart,ae.selectionEnd]; }catch(e){} }

    ? '<div class="notice bad"><b>データを読み込めませんでした。</b><span>通信状態を確認して、ページを再読み込みしてください。（'+esc(S.loadErr.userMessage||S.loadErr.code)+'）</span></div><button class="btn" type="button" data-act="reload">再読み込み</button>'
    : '<div class="empty"><span class="spin"></span>　データを読み込んでいます…</div>';
  else if(S.view==="title") html=viewTitle();
  else if(S.view==="copy") html=viewCopy();
  else if(S.view==="scan") html=viewScanned();
  else if(S.view==="intro") html=viewIntro();

  else if(S.view==="rules") html=viewRules();

}

function inlineSave(btn, action, payload, done){
  var orig=btn.innerHTML; btn.disabled=true; btn.innerHTML='<span class="spin"></span> 保存しています…';
  call(action,payload).then(function(r){
    if(r&&r.state) applyState(r.state);

    var box=$("scanErr"); if(!box) return;

      ? '<div class="notice bad" role="alert"><b>この操作はできませんでした。</b><span>'+esc(err.userMessage)+'</span></div>'
      : '<div class="notice bad" role="alert"><b>保存できませんでした。登録は完了していません。</b><span>通信状態を確認して、もう一度ボタンを押してください。続けて失敗する場合は総務部へ連絡してください。（'+esc(err.code)+'）</span></div>';
    refresh();
  });
}

function openScanner(opts){

    (opts.manual?'<details><summary class="small" style="cursor:pointer">QRが読めないときは管理番号を入力</summary><div class="btn-row" style="margin-top:8px"><input type="text" id="scanManual" placeholder="例：BK-005-2" style="flex:1;min-width:150px"><button class="btn" id="scanManualBtn" type="button">決定</button></div></details>':'<p class="small muted">QRが読み取れないときは、総務部へ連絡してください。</p>')+
    '<div class="btn-row"><button class="btn" data-close type="button">'+(opts.continuous?"読み取りを終える":"閉じる")+'</button></div>',
  function(){
    scan={opts:opts, stream:null, raf:0, last:"", lastAt:0, busy:false, canvas:document.createElement("canvas")};
    modalCleanup=stopScanner;
    $("scanFile").addEventListener("change",function(){ if(this.files&&this.files[0]) decodeFile(this.files[0]); this.value=""; });
    if($("scanManualBtn")) $("scanManualBtn").addEventListener("click",function(){ var v=$("scanManual").value; var id=parseCode(v); if(id){ $("scanManual").value=""; gotCode(id);} else scanMsg("管理番号の形式が違います（例：BK-005-2）","ng"); });

function scanMsg(t, kind){ var r=$("scanResult"); if(r) r.innerHTML='<div class="scan-result '+(kind||"ok")+'">'+esc(t)+'</div>'; }
function startLive(){
  if(typeof jsQR!=="function"){ $("scanMsg").hidden=false; $("scanMsg").innerHTML="<b>読み取り機能を読み込めませんでした。</b><span>通信状態を確認するか、管理番号を入力してください。</span>"; return; }
  if(IN_GAS){ liveUnavailable({name:"InGoogle"}); return; }
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ liveUnavailable({name:"NoApi"}); return; }
  navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false})
  .catch(function(err){ if(err && err.name==="OverconstrainedError") return navigator.mediaDevices.getUserMedia({video:true,audio:false}); throw err; })
  .then(function(stream){
    if(!scan){ stream.getTracks().forEach(function(t){t.stop();}); return; }
    scan.stream=stream; var v=$("scanVideo"); v.srcObject=stream; v.play().catch(function(){});
    $("scanLive").hidden=false; $("photoBtn").classList.remove("primary"); tick();
  }).catch(liveUnavailable);
}

function liveUnavailable(err){
  var m=$("scanMsg"); if(!m) return; m.hidden=false;
  var name=(err&&err.name)||"", ua=navigator.userAgent||"", iOS=/iPhone|iPad|iPod/.test(ua);
  var inApp=/Line\/|FBAN|FBAV|Instagram|MicroMessenger|KAKAOTALK/i.test(ua);
  var head, body;
  if(name==="InGoogle"){
    var url=S.view==="admin"?ADMIN_URL:PAGE_URL;
    head="このページ（Googleのページ）ではカメラを起動できません。";
    body='カメラが使えるページを開いてください：<br><a href="'+esc(url)+'" target="_top" class="mono" style="word-break:break-all">'+esc(url)+'</a><br>または、下の「写真を撮って読み取る」を使ってください。';
  } else if(inApp){
    head="LINEなどのアプリ内の画面では、カメラを起動できません。";
    body="画面右上（または右下）のメニューから「ブラウザで開く」「Safariで開く」「Chromeで開く」を選び、開き直してください。";
  } else if(name==="NotAllowedError"||name==="SecurityError"){
    head="カメラの使用が許可されていません。";

  } else {

function tick(){
  if(!scan||!scan.stream) return;
  var v=$("scanVideo");
  if(v && v.readyState>=2 && !scan.busy){
    var w=Math.min(720,v.videoWidth), h=Math.round(v.videoHeight*w/v.videoWidth), c=scan.canvas; c.width=w; c.height=h;
    var ctx=c.getContext("2d",{willReadFrequently:true}); ctx.drawImage(v,0,0,w,h);
    var r=jsQR(ctx.getImageData(0,0,w,h).data,w,h,{inversionAttempts:"dontInvert"});
    if(r&&r.data) handleRaw(r.data);
  }
  scan.raf=requestAnimationFrame(tick);
}
function decodeFile(file){
  scanMsg("読み取っています…","warn");
  var url=URL.createObjectURL(file), img=new Image();
  img.onload=function(){
    var found=null;
    [1600,1000,640].some(function(max){
      var s=Math.min(1,max/Math.max(img.width,img.height)), w=Math.round(img.width*s), h=Math.round(img.height*s), c=document.createElement("canvas"); c.width=w; c.height=h;
      var ctx=c.getContext("2d"); ctx.drawImage(img,0,0,w,h);
      var r=jsQR(ctx.getImageData(0,0,w,h).data,w,h,{inversionAttempts:"attemptBoth"}); if(r&&r.data) found=r.data; return !!found; });
    URL.revokeObjectURL(url);
    if(found) handleRaw(found, true); else scanMsg("QRコードが見つかりませんでした。QRコードを大きく、明るい場所で撮影してください。","ng");
  };
  img.onerror=function(){ scanMsg("画像を読み込めませんでした。もう一度撮影してください。","ng"); };
  img.src=url;
}
function handleRaw(text, fromPhoto){
  var id=parseCode(text), now=Date.now();
  if(!id){ if(now-scan.lastAt>2000||fromPhoto){ scanMsg("このQRコードは書籍ラベルではありません。","ng"); scan.lastAt=now; } return; }
  if(id===scan.last && now-scan.lastAt<3000 && !fromPhoto) return;
  scan.last=id; scan.lastAt=now; gotCode(id);
}
function gotCode(id){
  if(navigator.vibrate) try{ navigator.vibrate(60); }catch(e){}
  var o=scan.opts;
  if(!o.continuous){ stopScanner(); modalCleanup=null; o.onCode(id); return; }
  scan.busy=true; o.onCode(id).then(function(){ scan&&(scan.busy=false); }, function(){ scan&&(scan.busy=false); });
}
function stopScanner(){ if(!scan) return; cancelAnimationFrame(scan.raf); if(scan.stream) scan.stream.getTracks().forEach(function(t){ t.stop(); }); scan=null; }

    '<label class="check" for="pOk"><input type="checkbox" id="pOk"><span>本番運用を始めるため、サンプルデータを削除します</span></label>'+
    '<div id="saveErr" hidden></div><div class="btn-row"><button class="btn danger" id="mOk" type="button" disabled>削除する</button><button class="btn" data-close type="button">やめる</button></div>',
  function(){ $("pOk").addEventListener("change",function(){ $("mOk").disabled=!this.checked; });
    $("mOk").addEventListener("click",function(){ runSave(this,"purgeSample",{token:S.token},"サンプルデータを削除しました",function(){ if(S.empId&&!S.emps[S.empId]){ S.empId=null; try{ localStorage.removeItem(LS_EMP); }catch(e){} } }); }); });
}
function showLabels(){
  var ids=bookArr().filter(function(b){ return S.labelSel[b.id]; }).map(function(b){ return b.id; });
  var html='<div class="labels">'+ids.map(function(id){ var b=S.books[id], svg="";
    try{ var q=qrcode(0,"M"); q.addData(qrUrl(id)); q.make(); svg=q.createSvgTag({cellSize:4,margin:0,scalable:true}); }catch(e){ svg="QRエラー"; }
    return '<div class="label"><div class="q">'+svg+'</div><div><div class="id">'+esc(id)+'</div><div class="tt">'+esc(b.title)+'</div><div class="org">本社 総務部 貸出図書</div></div></div>'; }).join("")+'</div>';
  $("printArea").innerHTML=html;
  openModal('<h2>QRラベル（'+ids.length+'枚）</h2><p class="small muted">「印刷する」でA4に印刷できます（PC推奨）。スマホでは画面を長押しして画像として保存することもできます。</p><div style="max-height:55vh;overflow:auto">'+html+'</div>'+
    '<div class="btn-row"><button class="btn primary" id="mPrint" type="button">印刷する</button><button class="btn" data-close type="button">閉じる</button></div>',
  function(){ $("mPrint").addEventListener("click",function(){ window.print(); }); });
}

/* ---------- events ---------- */
document.addEventListener("click",function(ev){
  var t=ev.target.closest("button,[data-close]"); if(!t) return;
  if(t.hasAttribute("data-close")){ closeModal(); return; }
  if(t.id==="whoBtn"){ if(S.loaded) pickEmpModal(); return; }
  var a;
  if((a=t.getAttribute("data-tab"))){ S.view=a; S.copyId=null; render(); window.scrollTo(0,0); return; }
  if((a=t.getAttribute("data-go"))){ S.view=a; S.copyId=null; render(); window.scrollTo(0,0); return; }
  if((a=t.getAttribute("data-group"))){ S.group=a; S.copyId=null; S.view="title"; render(); window.scrollTo(0,0); return; }
  if((a=t.getAttribute("data-status"))){ S.status=a; render(); return; }
  if((a=t.getAttribute("data-admintab"))){ S.adminTab=a; if(a==="inv") S.inv=null; if(a==="mail") S.reqs=null; render(); return; }
  if((a=t.getAttribute("data-intro"))){ S.group=a; S.view="intro"; render(); window.scrollTo(0,0); return; }
  if((a=t.getAttribute("data-hist"))){ S.histStatus=a; render(); return; }
  var act=t.getAttribute("data-act"), id=t.getAttribute("data-id"); if(!act) return;
  ({
    reload:function(){ location.reload(); },
    pickEmp:pickEmpModal,
    scanUser:function(){ openScanner({title:"本のQRコードを読み取る",help:"本のラベルのQRコードを枠の中に写してください。",onCode:userScanned}); },
    scanAdmin:function(){ openScanner({title:"QRコードを読み取る",help:"本のラベルのQRコードを枠の中に写してください。",manual:true,onCode:adminScanned}); },
    invScan:function(){ openScanner({title:"棚卸し：続けて読み取る",help:"1冊ずつQRコードを写すと自動で記録されます。終わったら「読み取りを終える」。",continuous:true,manual:true,onCode:invScanned}); },
    borrow:function(){ borrowModal(id); }, "return":function(){ returnModal(id,false); }, extend:function(){ extendModal(id); },
    asUser:function(){ userScanned(id); },
    mailReq:function(){ mailReqModal(id); },
    shipScan:function(){ var no=id; openScanner({title:"発送する本のQRを読み取る",help:"郵送する本のQRラベルを枠の中に写してください。",manual:true,onCode:function(code){ shipScanned(no,code); }}); },
    reqCancel:function(){ reqCancelModal(id); },
    introEdit:function(){ introForm(id); },
    copyUrl:function(){ var u=$("introUrl"); try{ navigator.clipboard.writeText(u.value).then(function(){ toast("リンクをコピーしました"); },function(){ u.select(); toast("リンクを選択しました。コピーしてください"); }); }catch(x){ u.select(); } },
    inlineBorrow:function(){ var e=curEmp(), b=S.books[id]; inlineSave(t,"borrow",{empId:e.id,bookId:id},function(r){ return {title:"借りました", text:"「"+b.title+"」（"+id+"）を "+e.name+" さんの名前で登録しました。返却期限は "+jp(r.loan.dueDate)+" です。"}; }); },
    inlineReturn:function(){ var l=S.loans[id], b=S.books[l.bookId]||{}; inlineSave(t,"returnLoan",{loanNo:id},function(){ return {title:"返却しました", text:"「"+(b.title||l.bookId)+"」の返却を登録しました。"}; }); },
    inlineExtend:function(){ var l=S.loans[id], b=S.books[l.bookId]||{}; inlineSave(t,"extend",{loanNo:id},function(r){ return {title:"延長しました", text:"「"+(b.title||l.bookId)+"」の新しい返却期限は "+jp(r.dueDate)+" です。延長は1回までです。"}; }); },
    adminReturn:function(){ returnModal(id,true); }, adminCancel:function(){ cancelModal(id); },
    bookNew:function(){ bookForm(null); }, bookEdit:function(){ bookForm(id); }, bookToggle:function(){ bookToggle(id); }, addCopy:function(){ addCopyModal(id); },
    empNew:function(){ empForm(null); }, empEdit:function(){ empForm(id); }, empToggle:function(){ empToggle(id); },
    labelAll:function(){ bookArr().forEach(function(b){ S.labelSel[b.id]=true; }); render(); },
    labelNone:function(){ S.labelSel={}; render(); },
    labelShow:showLabels,
    invStart:function(){ t.disabled=true; call("invStart",{token:S.token}).then(function(r){ S.inv=r; applyState(r.state); render(); }).catch(function(e){ t.disabled=false; handleAdminErr(e); }); },
    invFinish:function(){
      var miss=S.inv?bookArr().length-S.inv.checked.length:0;
      openModal('<h2>棚卸しを完了しますか？</h2><p>未確認の本が <b>'+miss+' 冊</b> あります。'+(miss?'完了すると、未確認の管理番号が「棚卸履歴」に記録されます。':'')+'</p>'+okRow("完了する"),
        function(){ $("mOk").addEventListener("click",function(){ runSave(this,"invFinish",{token:S.token},"棚卸しを完了し、結果を保存しました",function(r){ S.inv=r; }); }); });
    },
    purge:purgeModal,
    pwChange:function(){ runSave($("pwBtn"),"changePassword",{token:S.token,current:$("pwCur").value,next:$("pwNew").value},"管理者パスワードを変更しました"); },
    logout:function(){ S.token=null; S.inv=null; try{ localStorage.removeItem(LS_TOKEN); }catch(e){} render(); toast("ログアウトしました"); }
  }[act]||function(){})();
});
document.addEventListener("submit",function(ev){
  if(ev.target.id!=="loginForm") return;
  ev.preventDefault();
  var btn=$("loginBtn"), pw=$("pw").value; btn.disabled=true; btn.innerHTML='<span class="spin"></span> 確認しています…';
  call("login",{password:pw}).then(function(r){ S.token=r.token; try{ localStorage.setItem(LS_TOKEN,r.token); }catch(e){} render(); toast("ログインしました"); })
    .catch(function(e){ btn.disabled=false; btn.textContent="ログイン"; var er=$("loginErr"); er.hidden=false; er.textContent=e.userMessage||"ログインできませんでした（"+e.code+"）。通信状態を確認してください。"; });
});
document.addEventListener("input",function(ev){
  if(ev.target.id==="q"){ S.q=ev.target.value; render(); }
  else if(ev.target.id==="hq"){ S.histQ=ev.target.value; render(); }
});
document.addEventListener("change",function(ev){
  if(ev.target.id==="cat"){ S.cat=ev.target.value; render(); }
  else if(ev.target.id==="scanDept"){ S.pickDept=ev.target.value||null; var ce=curEmp(); if(ce && (ce.dept||"（所属なし）")!==S.pickDept){ S.empId=null; try{ localStorage.removeItem(LS_EMP); }catch(x){} } render(); }
  else if(ev.target.id==="scanEmp"){ S.empId=ev.target.value||null; try{ if(S.empId) localStorage.setItem(LS_EMP,S.empId); else localStorage.removeItem(LS_EMP); }catch(e){} render(); }
  else if(ev.target.id==="scanShelved"){ var g=$("scanGo"); if(g) g.disabled=!ev.target.checked; }
  else if(ev.target.hasAttribute&&ev.target.hasAttribute("data-label")){ var k=ev.target.getAttribute("data-label"); if(ev.target.checked) S.labelSel[k]=true; else delete S.labelSel[k]; render(); }
});
document.addEventListener("visibilitychange",function(){ if(document.visibilityState==="visible") refresh(); });
setInterval(function(){ if(document.visibilityState==="visible" && !modalOpen) refresh(); }, 60000);

/* ---------- boot ---------- */
var initialCopy=null;
function boot(){
  call("state").then(function(st){
    applyState(st);
    var check = S.token
      ? call("checkToken",{token:S.token}).then(function(){ return true; }, function(){ S.token=null; try{ localStorage.removeItem(LS_TOKEN); }catch(e){} return false; })
      : Promise.resolve(false);
    return check.then(function(isAdmin){
      if(!initialCopy) render();
      else if(isAdmin) adminFromLink(initialCopy);
      else userScanned(initialCopy);
    });
  }).catch(function(e){ S.loadErr=e; render(); });
}
/* Opened from a QR label with the phone camera while logged in as admin: show the admin card, and record inventory if one is running. */
function adminFromLink(id){
  S.view="admin"; S.adminTab="scan"; S.scanCopy=id;
  S.scanNote = S.books[id] ? null : {kind:"ng", text:"管理番号「"+id+"」の本は台帳にありません。"};
  render();
  if(!S.books[id]) return;
  call("invState",{token:S.token}).then(function(r){
    S.inv=r; applyState(r.state);
    if(!r.open){ render(); return; }
    return call("invScan",{token:S.token, bookId:id}).then(function(x){
      S.inv=x; applyState(x.state);
      var sc=x.scan, total=bookArr().length, n=x.checked.length;
      S.scanNote = sc.dup ? {kind:"warn", text:"棚卸し：" + sc.bookId + " は確認済みです（" + n + "/" + total + "冊）"}
        : sc.status==="貸出中" ? {kind:"warn", text:"棚卸し：" + sc.bookId + " を記録しました（" + n + "/" + total + "冊）。※アプリでは貸出中です。書棚にあった場合は返却処理をしてください。"}
        : {kind:"ok", text:"棚卸し：" + sc.bookId + " を記録しました（" + n + "/" + total + "冊）"};
      render();
    });
  }).catch(function(e){ S.scanNote={kind:"ng", text:"棚卸しに記録できませんでした。ページを開き直してください。（"+(e.userMessage||e.code)+"）"}; render(); });
}
if(IN_GAS){
  try{
    google.script.url.getLocation(function(loc){ var b=loc&&loc.parameter&&loc.parameter.b, tg=loc&&loc.parameter&&loc.parameter.t; initialCopy=b?parseCode(b):null; if(tg){ S.group=String(tg).toUpperCase(); S.view="intro"; } boot(); });
  }catch(e){ boot(); }
} else {
  /* Pages outside Google (camera works). admin.html opens on the 総務部 tab; the top page is for employees. */
  var qp=new URLSearchParams(location.search), qb=qp.get("b"), qt=qp.get("t"); initialCopy=qb?parseCode(qb):null;
  if(qt && !initialCopy){ S.group=qt.toUpperCase(); S.view="intro"; }
  if(/admin\.html$/.test(location.pathname)){
    if(!initialCopy && !qt) S.view="admin";
    var bs=document.querySelector(".brand span"); if(bs) bs.textContent="本社 総務部（管理用）";
    document.title="KTライブラリ（総務部）";
  }
  boot();
}
})();
</script>
